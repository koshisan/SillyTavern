<div id="multi_profile_container" class="multi-profile-container">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Multi-Profile Overrides</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <small>Assign a connection profile to a feature so it does not use the globally selected one. Profiles are managed under <em>Connection Profiles</em>. Leave a feature unassigned to use the active global profile.</small>

            <label for="multi_profile_chat" class="multi-profile-row">
                <span>Roleplay chat</span>
                <select id="multi_profile_chat" class="multi-profile-select"></select>
            </label>

            <label for="multi_profile_memory" class="multi-profile-row">
                <span>Story summary</span>
                <select id="multi_profile_memory" class="multi-profile-select"></select>
            </label>

            <label for="multi_profile_expressions" class="multi-profile-row">
                <span>Character expressions</span>
                <select id="multi_profile_expressions" class="multi-profile-select"></select>
            </label>

            <label for="multi_profile_sd" class="multi-profile-row">
                <span>Image generation</span>
                <select id="multi_profile_sd" class="multi-profile-select"></select>
            </label>
        </div>
    </div>
</div>
