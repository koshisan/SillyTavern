<div id="multi_profile_container" class="wide100p">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Multi-Profile Overrides</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="marginBot10">
                <small>Assign a connection profile to a feature so it does not use the globally selected one. Profiles are managed under <em>Connection Profiles</em>. Leave a feature unassigned to use the active global profile.</small>
            </div>

            <div class="flex-container marginBot5">
                <label for="multi_profile_memory" class="flex1">Story summary</label>
                <select id="multi_profile_memory" class="text_pole flex2"></select>
            </div>

            <div class="flex-container marginBot5">
                <label for="multi_profile_expressions" class="flex1">Character expressions</label>
                <select id="multi_profile_expressions" class="text_pole flex2"></select>
            </div>

            <div class="flex-container marginBot5">
                <label for="multi_profile_sd" class="flex1">Image generation</label>
                <select id="multi_profile_sd" class="text_pole flex2"></select>
            </div>
        </div>
    </div>
</div>
