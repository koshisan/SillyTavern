<div class="wan22-i2v-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Wan2.2 Image-to-Video</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label for="wan22_i2v_comfy_url">ComfyUI URL</label>
            <input id="wan22_i2v_comfy_url" class="text_pole" type="text" placeholder="http://192.168.81.252:8188" />

            <label class="checkbox_label" for="wan22_i2v_button_visible">
                <input id="wan22_i2v_button_visible" type="checkbox" />
                Show video button on image messages
            </label>

            <button id="wan22_i2v_ping" class="menu_button">Ping ComfyUI</button>

            <hr>

            <div class="flex-container">
                <div class="flex1">
                    <label for="wan22_i2v_max_edge">Max edge (px)</label>
                    <input id="wan22_i2v_max_edge" class="text_pole" type="number" min="256" max="2048" step="8" />
                </div>
                <div class="flex1">
                    <label for="wan22_i2v_steps">Steps</label>
                    <input id="wan22_i2v_steps" class="text_pole" type="number" min="1" max="80" />
                </div>
                <div class="flex1">
                    <label for="wan22_i2v_cfg">CFG</label>
                    <input id="wan22_i2v_cfg" class="text_pole" type="number" min="1" max="20" step="0.5" />
                </div>
            </div>

            <div class="flex-container">
                <div class="flex1">
                    <label for="wan22_i2v_length">Frame count</label>
                    <input id="wan22_i2v_length" class="text_pole" type="number" min="8" max="240" />
                </div>
                <div class="flex1">
                    <label for="wan22_i2v_fps">FPS</label>
                    <input id="wan22_i2v_fps" class="text_pole" type="number" min="1" max="60" />
                </div>
            </div>

            <label for="wan22_i2v_prompt">Positive prompt</label>
            <textarea id="wan22_i2v_prompt" class="text_pole textarea_compact" rows="2"></textarea>

            <label for="wan22_i2v_negative_prompt">Negative prompt</label>
            <textarea id="wan22_i2v_negative_prompt" class="text_pole textarea_compact" rows="2"></textarea>

            <label for="wan22_i2v_workflow">Custom workflow (API-format JSON, optional)</label>
            <textarea id="wan22_i2v_workflow" class="text_pole textarea_compact" rows="4" placeholder='Leave blank to use the plugin&#39;s bundled default_workflow.json.'></textarea>
        </div>
    </div>
</div>
